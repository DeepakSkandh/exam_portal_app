{% extends "base.html" %}
{% block title %}Edit Slot{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto card p-4">
  <h4 class="mb-3">Edit Slot #{{ slot.id }}</h4>
  <form method="POST">
    <label class="form-label">Date</label>
    <input type="date" name="date" class="form-control mb-2" value="{{ slot.date }}" required>
    <label class="form-label">Start Time</label>
    <input type="time" name="start_time" class="form-control mb-2" value="{{ slot.start_time.strftime('%H:%M') }}" required>
    <label class="form-label">End Time</label>
    <input type="time" name="end_time" class="form-control mb-2" value="{{ slot.end_time.strftime('%H:%M') }}" required>
    <label class="form-label">Capacity</label>
    <input type="number" name="capacity" min="1" class="form-control mb-3" value="{{ slot.capacity }}" required>
    <button class="btn btn-primary">Save</button>
    <a href="{{ url_for('examiner_slots', exam_id=slot.exam_id) }}" class="btn btn-secondary">Back</a>
  </form>
</div>
{% endblock %}
