{% extends "base.html" %}
{% block title %}Profile{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card p-4">
      <h3 class="mb-3">My Profile</h3>
      <form method="POST">
        <div class="mb-3">
          <label class="form-label">Email (cannot change)</label>
          <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
        </div>
        <div class="mb-3">
          <label class="form-label">Name</label>
          <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
        </div>
        {% if current_user.role == 'student' %}
        <div class="mb-3">
          <label class="form-label">Roll Number</label>
          <input type="text" name="roll_no" class="form-control" value="{{ current_user.roll_no or '' }}">
        </div>
        {% elif current_user.role == 'examiner' %}
        <div class="mb-3">
          <label class="form-label">Department</label>
          <input type="text" name="department" class="form-control" value="{{ current_user.department or '' }}">
        </div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label">New Password (leave blank to keep old)</label>
          <input type="password" name="password" class="form-control">
        </div>
        <button class="btn btn-primary">Save</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
