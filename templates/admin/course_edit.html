{% extends "base.html" %}
{% block title %}Edit Course{% endblock %}
{% block content %}
<div class="col-md-6 mx-auto card p-4">
  <h4 class="mb-3">Edit Course</h4>
  <form method="POST">
    <label class="form-label">Code</label>
    <input name="code" class="form-control mb-2" value="{{ course.code }}" required>
    <label class="form-label">Name</label>
    <input name="name" class="form-control mb-2" value="{{ course.name }}" required>
    <label class="form-label">Description</label>
    <textarea name="description" class="form-control mb-2">{{ course.description or '' }}</textarea>
    <label class="form-label">Status</label>
    <select name="status" class="form-select mb-3">
      {% for s in ['Active', 'Inactive'] %}
      <option {% if course.status == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
    <button class="btn btn-primary">Save</button>
    <a href="{{ url_for('admin_courses') }}" class="btn btn-secondary">Back</a>
  </form>
</div>
{% endblock %}
